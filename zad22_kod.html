<h1>Zadanie 22 - Użycie ID</h1>

<p> Orzeł HTML, czyli HyperText Markup Language, to podstawowy język znaczników <br>
wykorzystywany do budowania szkieletu oraz struktury wszystkich stron internetowych. <br>
Za pomocą specjalnych tagów, takich jak nagłówki, paragrafy, listy czy odnośniki, <br>
informuje on przeglądarkę internetową, jak ma interpretować i układać treść na ekranie. </p>

<p id="gruby_orzel"> Orzeł CSS, czyli Cascading Style Sheets, to język stworzony do opisu prezentacji dokumentu HTML. <br>
Podczas gdy HTML odpowiada za treść i strukturę, CSS zajmuje się całą stroną wizualną: <br>
odpowiada za kolory, czcionki, marginesy, układ elementów na ekranie oraz animacje. <br>
Dzięki rozdzieleniu struktury od wyglądu, programiści mogą łatwo zmieniać design całej witryny. </p>

<h1 id="dlawszyskich_orzel"> Orzeł Każdy element w języku HTML składa się zazwyczaj z tagu otwierającego, <br>
treści umieszczonej wewnątrz oraz tagu zamykającego ze znakiem ukośnika. <br>
Dodatkowo, w tagu otwierającym możemy umieszczać specyficzne atrybuty, <br>
takie jak klasy, identyfikatory czy odnośniki, które przekazują przeglądarce <br>
lub arkuszom CSS dodatkowe instrukcje dotyczące danego elementu na stronie. </h1>

<div id="dlawszyskich_orzel"> Orzeł Model pudełkowy to absolutny fundament projektowania układu stron w CSS, <br>
ponieważ przeglądarka traktuje każdy element HTML jako prostokątne pudełko. <br>
Pudełko to składa się z samej zawartości (content), wewnętrznego marginesu (padding), <br>
obramowania (border) oraz zewnętrznego marginesu (margin) odpychającego inne elementy. <br>
Zrozumienie zależności między tymi warstwami jest kluczowe do poprawnego pozycjonowania. </div>
